<!-- @dsCard group="Colors" viewport="700x130" name="Connection colour profiles" subtitle="Required background and foreground pairs across connection-owned UI" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-ui); background: #fff; padding: 22px; }
  .row { display: flex; gap: 26px; align-items: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 10px; color: var(--text-secondary); }
  .dot { width: 42px; height: 26px; border-radius: var(--radius-sm); border: 1px solid currentColor; }
  .note { margin-top: 16px; font-size: var(--text-xs); color: var(--text-secondary); max-width: 560px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="dot" style="background:var(--conn-blue-bg);color:var(--conn-blue-fg)"></div>blue</div>
    <div class="item"><div class="dot" style="background:var(--conn-green-bg);color:var(--conn-green-fg)"></div>green</div>
    <div class="item"><div class="dot" style="background:var(--conn-amber-bg);color:var(--conn-amber-fg)"></div>amber</div>
    <div class="item"><div class="dot" style="background:var(--conn-red-bg);color:var(--conn-red-fg)"></div>red</div>
    <div class="item"><div class="dot" style="background:var(--conn-violet-bg);color:var(--conn-violet-fg)"></div>violet</div>
    <div class="item"><div class="dot" style="background:var(--conn-slate-bg);color:var(--conn-slate-fg)"></div>slate</div>
  </div>
  <p class="note">Each saved connection links to a profile. Active rows and tabs use its full pair; inactive toolbar, server-node and status indicators use the foreground dot. Custom profiles must meet 4.5:1 contrast.</p>
</body>
</html>
